name: CI

# Build + test every PR/push to main and dev. Version-bump gate applies ONLY to
# PRs targeting main (so dev stays a tests-only integration branch, matching
# the delivery model: dev = tests-only, dev -> release = RC, release -> main =
# public release).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version-bump gate: a PR to MAIN must carry a package.json version
  # strictly greater than main's, so every release ships a new version.
  # Runs only when the PR base is main (not dev).
  version-check:
    name: Version bump required
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout base (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout head (PR)
        uses: actions/checkout@v4
        with:
          path: head
      - name: Verify version bumped vs main
        run: node head/apps/pwa/scripts/check-version-bump.mjs base/apps/pwa/package.json head/apps/pwa/package.json

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches Dockerfile (node:22-alpine)
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm -r --if-present build

  # Keep the shipped Docker image honest: the container build is the real
  # artifact Talaria runs as, so build it in CI too.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pwa/Dockerfile
          push: false
          load: true
          tags: talaria:ci
